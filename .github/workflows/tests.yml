name: Python checks

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run simulated conversion and metadata tests
        run: python -m unittest discover -s tests -v
      - name: Check that offline guide and documentation match
        run: python scripts/export_quality_guide.py --check
